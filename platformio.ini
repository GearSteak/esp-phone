; DIY 4G Phone — Waveshare ESP32-S3-SIM7670G-4G
; Arduino + LVGL + FreeRTOS dual-core

[env:esp32-s3-sim7670g]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_MODE_OCT=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
  -I include
  -IC:/Users/Isaac/.platformio/packages/framework-arduinoespressif32/libraries/FS/src
  -DUSER_SETUP_LOADED=1
  -DILI9486_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MOSI=19
  -DTFT_SCLK=39
  -DTFT_MISO=-1
  -DTFT_CS=21
  -DTFT_DC=33
  -DTFT_RST=45
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSPI_FREQUENCY=27000000

lib_deps =
  lvgl/lvgl @ ^8.3.11
  bodmer/TFT_eSPI @ ^2.5.43
  bblanchon/ArduinoJson @ ^7.2.1
  earlephilhower/ESP8266Audio @ ^1.9.9
  espressif/esp32-camera @ ^2.0.4
  jgromes/RadioLib @ ^7.1.2

lib_ldf_mode = chain+
monitor_filters = esp32_exception_decoder, time

build_unflags =
  -std=gnu++11

build_src_flags =
  -std=gnu++17

build_src_filter =
  +<*>
  -<gateway_main.cpp>

; ---------------------------------------------------------------------------
; Pi-primary bridge: QWERTY + volume + LoRa — flash with:
;   pio run -e esp32-s3-gateway -t upload
; Cellular is on Waveshare SIM7600G-H HAT (USB to Pi), not this firmware.
; ---------------------------------------------------------------------------
[env:esp32-s3-gateway]
extends = env:esp32-s3-sim7670g
build_flags =
  ${env:esp32-s3-sim7670g.build_flags}
  -DGATEWAY_MODE=1
lib_deps =
  jgromes/RadioLib @ ^7.1.2
lib_ignore =
  lvgl
  TFT_eSPI
  ArduinoJson
  ESP8266Audio
  esp32-camera
build_src_filter =
  +<gateway_main.cpp>
  +<gateway_bridge.cpp>
  +<keyboard.cpp>
  +<lora_radio.cpp>

; ---------------------------------------------------------------------------
; Heltec Wireless Tracker — SX1262 + ST7735 notify panel
;   pio run -e heltec-wireless-tracker-gateway -t upload
; Pinout: docs/HELTEC_TRACKER_PINOUT.md
; ---------------------------------------------------------------------------
[env:heltec-wireless-tracker-gateway]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_unflags =
  -std=gnu++11
build_src_flags =
  -std=gnu++17
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DGATEWAY_MODE=1
  -DHELTEC_WIRELESS_TRACKER=1
  -DLORA_RADIO_SX1262=1
  -I include
  -DUSER_SETUP_LOADED=1
  -DST7735_DRIVER=1
  -DST7735_GREENTAB160x80=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_WIDTH=80
  -DTFT_HEIGHT=160
  -DTFT_MOSI=42
  -DTFT_SCLK=41
  -DTFT_CS=38
  -DTFT_DC=40
  -DTFT_RST=39
  -DTFT_BL=21
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSPI_FREQUENCY=27000000
  -DUSE_HSPI_PORT=1
lib_deps =
  jgromes/RadioLib @ ^7.1.2
  bodmer/TFT_eSPI @ ^2.5.43
lib_ldf_mode = chain+
build_src_filter =
  +<gateway_main.cpp>
  +<gateway_bridge.cpp>
  +<keyboard.cpp>
  +<lora_radio.cpp>
  +<notify_display.cpp>
  +<cardkb.cpp>
  +<step_tilt.cpp>

